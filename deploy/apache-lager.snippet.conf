    # --- Lager-Cockpit: statische Oberflaeche unter /lager/ (nicht an Supabase weiterreichen) ---
    Alias /lager /opt/lager-cockpit/web
    <Directory /opt/lager-cockpit/web>
        Require all granted
        Options -Indexes
        AllowOverride None
        Header always set Cache-Control "no-cache"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "same-origin"
        Header always set X-Robots-Tag "noindex, nofollow"
        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"
    </Directory>
    ProxyPass /lager !
    # --- Ende Lager-Cockpit ---

